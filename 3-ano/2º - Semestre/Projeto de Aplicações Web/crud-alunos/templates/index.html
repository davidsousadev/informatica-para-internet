<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CRUD de Alunos</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <h1>CRUD de Alunos</h1>

        <form id="formAluno">

            <input
                type="text"
                id="nome"
                placeholder="Nome"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="number"
                id="idade"
                placeholder="Idade"
                required
            >

            <button type="submit" id="botao">
                Adicionar
            </button>

            <button
                type="button"
                id="cancelar"
                onclick="cancelarEdicao()"
                hidden
            >
                Cancelar
            </button>

        </form>

        <h2>Alunos cadastrados</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Idade</th>
                    <th>Ações</th>
                </tr>

            </thead>

            <tbody id="listaAlunos"></tbody>

        </table>

    </div>

    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
